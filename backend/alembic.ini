# Alembic config for scouting.db. Run commands from backend/:
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "describe the change"
# raw.db is not managed here (see SCHEMA.md §5).

[alembic]
script_location = %(here)s/migrations
# Files sort by date: 20261120_<rev>_<slug>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
# Left empty on purpose: migrations/env.py takes the URL from Settings
# (DATABASE_URL in the repo-root .env). Tests set it explicitly.
sqlalchemy.url =

[post_write_hooks]
# Format every new migration with ruff, so generated files pass `ruff check` as-is.
hooks = ruff_format, ruff_fix
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix --exit-zero REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
