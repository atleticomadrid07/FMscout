[project]
name = "scouting"
version = "0.1.0"
description = "Dual real-world + Football Manager scouting tool (backend)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "httpx>=0.27",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "typer>=0.29.2",
    "unidecode>=1.4.0",
]

[project.scripts]
scouting = "scouting.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scouting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
