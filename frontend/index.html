<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scout</title>
    <script>
      // Set the theme before the first paint so a dark-mode user never sees a white flash.
      // Same rule as src/theme/theme.ts: a stored choice wins, otherwise the system setting.
      try {
        var stored = localStorage.getItem('scout.theme')
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var mode = stored === 'light' || stored === 'dark' ? stored : dark ? 'dark' : 'light'
        document.documentElement.dataset.theme = mode
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
